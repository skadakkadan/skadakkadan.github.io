# Everything on the CV page comes from this file. Newest first in each list.

summary: >-
  Applied Biotechnology MSc (Distinction) working in NHS Clinical Blood Sciences. My interests
  connect environmental microbiology, natural-product discovery, microbial genomics and
  antimicrobial resistance. I came to molecular biotechnology from zoology and field ecology,
  and I am most interested in questions that link an ecological observation to its molecular mechanism.

