research:
  - when: May – Oct 2023
    role: Biopolymer Scientist Intern
    org: Cavendish Living Lab (bioplastics strand), University of Westminster, London
    detail: Bacterial cellulose from food-waste substrates with Komagataeibacter xylinus (5% yield increase); work on polyhydroxyalkanoates; sustainability projects combining hydroponics and microbial biofilms. Exhibited bacterial cellulose materials at the Cavendish Living Lab Symposium 2023.
  - when: Jun – Aug 2023
    role: Postgraduate Researcher
    org: University of Westminster, London
    detail: Screened more than 35 marine sediment isolates against Candida albicans and Pseudomonas aeruginosa; culture optimisation, enzyme assays and genome analysis with antiSMASH.
  - when: Feb – Jul 2021
    role: Research Intern
    org: M. S. Swaminathan Research Foundation, Wayanad, India
    detail: Biodiversity surveys across nine agroforestry sites (128 plant and 101 bird species) and statistical analysis in R. Co-author of the resulting Biodiversity and Conservation paper.
  - when: Undergraduate
    role: Research exposure, Parasitology Research Laboratory
    org: PSMO College, Tirurangadi (University of Calicut), India · Supervisor Dr P. A. Ahammed Shareef
    detail: "Helminth excretory–secretory products (ESPs) and experimental immunomodulation: how parasite-derived proteins may regulate host inflammatory responses. Exposure to the collagen-induced arthritis (CIA) mouse model, an established model of immune-mediated inflammatory arthritis used to evaluate candidate immunomodulatory interventions, alongside the laboratory's work on liver-fluke ESPs and immunodiagnostics. Research exposure within the group, not independently led experiments."

