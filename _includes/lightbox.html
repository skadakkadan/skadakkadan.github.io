<dialog class="lightbox" id="lightbox" aria-label="Image viewer">
  <div class="lb-stage">
    <img id="lb-img" src="data:," alt="">
    <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
  </div>
  <div class="lb-bar"><span id="lb-cap"></span><span class="lb-ctl"><span id="lb-count"></span><button type="button" id="lb-close">Close</button></span></div>
</dialog>
